name: Repair dependency lockfile (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/security-automation-2026-10'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Update lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Install resolved dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Commit lockfile after successful checks
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Refresh pnpm lockfile for Next.js security patch"
            git push
          fi
